# ============================================================
# DemoGen Docker Compose - Training & Inference on GPU servers
# ============================================================
#
# Usage:
#   docker compose up -d dev                                # Start persistent dev container
#   docker compose exec dev bash                            # Enter dev shell
#   docker compose --profile demogen run --rm demogen       # Run demo generation
#   docker compose --profile train run --rm train           # Run training
#   docker compose --profile inference run --rm inference   # Run evaluation

x-common: &common
  image: luobaigu/demogen:latest
  working_dir: /workspace/DemoGen
  ipc: host
  volumes:
    - ./:/workspace/DemoGen
    - ./scripts/entrypoint.sh:/entrypoint.sh
    # 覆盖默认入口点，让它先跑你的脚本
  entrypoint: ["/entrypoint.sh"]
  network_mode: host
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - HYDRA_FULL_ERROR=1
    - PYTHONPATH=/workspace/DemoGen:/workspace/DemoGen/diffusion_policies
    - LD_LIBRARY_PATH=/usr/local/lib/python3.10/dist-packages/cv2/../../lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/root/.mujoco/mujoco210/bin
    # - HTTP_PROXY
    # - HTTPS_PROXY
services:
  # --- Interactive Development (default) ---
  dev:
    <<: *common
    stdin_open: true
    tty: true
    command: bash -lc "sleep infinity"


  # --- Training ---
  train:
    <<: *common
    profiles: ["train"]
    working_dir: /workspace/DemoGen/diffusion_policies
    command: >
      bash train.sh
      ${DEMO:-jar}
      ${ALGO:-dp3}
      ${TASK:-oyhand}
      ${SEED:-0}

  # --- Inference / Evaluation ---
  inference:
    <<: *common
    profiles: ["inference"]
    working_dir: /workspace/DemoGen/experiments/segment_weighting
    command: >
      bash eval_experiments.sh
      ${EVAL_DIR:-/workspace/DemoGen/data/ckpts}
      ${ENV_RUNNER:-robosuite}
      ${EVAL_EPISODES:-20}

  # --- Demo Generation ---
  demogen:
    <<: *common
    profiles: ["demogen"]
    working_dir: /workspace/DemoGen/demo_generation
    command: >
      python -W ignore gen_demo.py
      --config-name=${DEMO_TASK:-flower}.yaml
      data_root=../data
      generation.range_name=${GEN_RANGE:-src}
      generation.mode=${GEN_MODE:-random}
      generation.n_gen_per_source=${N_GEN:-1}
      generation.render_video=${RENDER_VIDEO:-False}
